<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact — YEEUN</title>
  <meta name="description" content="Contact Yeeun for film scoring and music composition inquiries.">

  <link rel="stylesheet" href="style.css">

  <style>
    .contact-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 110px 40px 160px;
    }

    .contact-eyebrow {
      margin: 0 0 18px;
      color: #999;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .contact-page h1 {
      margin: 0 0 28px;
      color: #f2f2f2;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: clamp(48px, 6vw, 80px);
      font-weight: 300;
      line-height: 1.1;
      letter-spacing: -0.045em;
    }

    .contact-description {
      margin: 0 0 45px;
      color: #b5b5b5;
      font-size: 15px;
      line-height: 1.9;
    }

    .contact-email-label {
      margin: 0 0 12px;
      color: #888;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .contact-email {
      display: inline-block;
      padding-bottom: 6px;
      border-bottom: 1px solid #888;
      color: #f2f2f2;
      font-size: 20px;
      overflow-wrap: anywhere;
      transition: opacity 0.25s ease;
    }

    .contact-email:hover {
      opacity: 0.6;
    }

    @media (max-width: 700px) {
      .contact-page {
        padding: 80px 20px 110px;
      }

      .contact-page h1 {
        font-size: 52px;
      }

      .contact-description {
        font-size: 14px;
        margin-bottom: 35px;
      }

      .contact-email {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <a href="index.html" class="brand">YEEUN</a>

    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="about.html">About</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>

  <!-- CONTACT -->
  <main class="contact-page">

    <p class="contact-eyebrow">Contact</p>

    <h1>Let's Connect.</h1>

    <p class="contact-description">
      For collaborations or inquiries, feel free to reach out.
    </p>

    <p class="contact-email-label">Email</p>

    <a class="contact-email" href="mailto:ke9276@naver.com">ke9276@naver.com</a>

  </main>

  <!-- FOOTER -->
  <footer class="site-footer">

    <div class="footer-contact">
      <p>
        <a href="mailto:ke9276@naver.com">ke9276@naver.com</a>
      </p>
    </div>

    <p class="copyright">© 2026 Yeeun</p>

  </footer>

</body>
</html>
